<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- บังคับไม่ให้มือถือซูมหน้าจอเอง ซึ่งจะทำให้ iframe ล้นกรอบ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard ระบบส่วนตัว</title>
    <link rel="icon" type="image/png" href="https://geccc.msu.ac.th/academic/panupol.png">
    <link rel="apple-touch-icon" href="https://geccc.msu.ac.th/academic/panupol.png">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #f8f9fa;
            /* ล็อกหน้าจอหลักไม่ให้เลื่อน */
            overflow: hidden; 
            /* รองรับเบราว์เซอร์เก่า */
            height: 100vh;
            /* รองรับเบราว์เซอร์มือถือใหม่ (Dynamic Viewport) แก้ปัญหาแถบ URL บัง */
            height: 100dvh; 
        }

        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: -36px; /* ดัน iframe ขึ้นไปซ่อนแถบ Google */
            left: 0;
            width: 100%;
            /* ชดเชยความสูง 36px ที่โดนดันขึ้นไป (ใช้ dvh เป็นหลัก) */
            height: calc(100vh + 36px); /* Fallback */
            height: calc(100dvh + 36px); /* Modern Mobile */
            border: none;
        }
    </style>
</head>
<body><br><br>
    <div class="iframe-container">
        <!-- ไม่ต้องใส่ style ในบรรทัดนี้แล้ว ให้มันวิ่งไปอ่านจาก <style> ด้านบนแทน -->
        <iframe src="https://script.google.com/macros/s/AKfycbw2YKevWz0YZ8HkvJUXGzUb0N8W6gly7zdCJUfXvAKsVEfTRra3YULU3ZdALwIj1I08/exec"></iframe>
    </div>
</body>
</html>
